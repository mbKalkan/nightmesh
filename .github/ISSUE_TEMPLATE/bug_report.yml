name: Bug report
description: Something doesn't look or work right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you saw. A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a .glb file with …
        2. …
  - type: dropdown
    id: format
    attributes:
      label: File type
      options:
        - glTF binary (.glb)
        - glTF (.gltf with .bin and textures)
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Nightmesh, VS Code and OS versions (Help › About in VS Code shows the last two).
      placeholder: Nightmesh 0.1.0, VS Code 1.105.0, Windows 11
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics
      description: The GPU, if the model draws wrong or not at all.
      placeholder: Intel Iris Xe, NVIDIA RTX 3060, …
  - type: input
    id: theme
    attributes:
      label: Color theme
      placeholder: Dark Modern
  - type: textarea
    id: file
    attributes:
      label: Sample file
      description: >-
        If you can, attach a small model that shows the problem, or say where a public one can be
        found. Please remove anything private first.
